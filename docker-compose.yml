services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novaretail-rag-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: pgvector
      DB_PORT: 5432
      DB_DATABASE: novaretail_rag
      DB_USERNAME: novaretail_user
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: gemini-1.5-flash
      GEMINI_EMBEDDING_MODEL: text-embedding-004
    volumes:
      - ./:/var/www/novaretail-rag
    depends_on:
      - pgvector
    networks:
      - novaretail-rag-network

  postgres:
    image: postgres:16-alpine
    container_name: novaretail-rag-postgres
    environment:
      POSTGRES_DB: novaretail_admin
      POSTGRES_USER: novaretail_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - novaretail-rag-postgres-data:/var/lib/postgresql/data
    networks:
      - novaretail-rag-network

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: novaretail-rag-pgvector
    environment:
      POSTGRES_DB: novaretail_rag
      POSTGRES_USER: novaretail_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - novaretail-rag-pgvector-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - novaretail-rag-network

volumes:
  novaretail-rag-postgres-data:
  novaretail-rag-pgvector-data:

networks:
  novaretail-rag-network:
    driver: bridge
